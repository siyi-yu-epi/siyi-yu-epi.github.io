<!doctype html>
<html lang="{{ site.lang | default: "en-US" }}">
  <head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    {% seo %}
    <link rel="stylesheet" href="{{ "/assets/css/style.css?v=" | append: site.github.build_revision | relative_url }}">
    {% include head-custom.html %}
  </head>
  <body>
    <div class="wrapper">
      <header>
        <h1><a href="{{ "/" | absolute_url }}">{{ site.title }}</a></h1>
        {% if site.logo %}
          <img src="{{ site.logo | relative_url }}" alt="{{ site.logo_alt | escape }}">
        {% endif %}
        <p>{{ site.role }}</p>
        <p>{{ site.affiliation }}</p>
        <p><a href="mailto:{{ site.email }}">{{ site.email }}</a></p>
        <p><a href="{{ site.cv_path | relative_url }}">Download CV</a></p>
        <p>
          <a href="{{ site.google_scholar }}" aria-label="Google Scholar" title="Google Scholar"><img src="https://cdn.jsdelivr.net/npm/simple-icons@v13/icons/googlescholar.svg" alt="" width="24" height="24"></a>
          &nbsp;
          <a href="{{ site.ssrn }}" aria-label="SSRN" title="SSRN"><img src="https://cdn.jsdelivr.net/npm/simple-icons@v13/icons/ssrn.svg" alt="" width="24" height="24"></a>
          &nbsp;
          <a href="{{ site.linkedin }}" aria-label="LinkedIn" title="LinkedIn"><img src="https://cdn.jsdelivr.net/npm/simple-icons@v13/icons/linkedin.svg" alt="" width="24" height="24"></a>
        </p>
      </header>
      <section aria-label="Academic profile">
        {{ content }}
      </section>
    </div>
  </body>
</html>
